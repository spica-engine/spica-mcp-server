name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dry-run (e.g. 0.20.9). Nothing is published."
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # package.json carries a placeholder version; the release tag is the
      # single source of truth, so a tag/version mismatch cannot happen.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not a valid semver version."
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
